<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>StageSync — Silent Church Stage &amp; Sound Booth Cue</title>
    <meta name="description" content="Silent stage-to-sound-booth communication PWA for church musicians and audio engineers." />
    <meta property="og:title" content="StageSync — Silent Church Stage &amp; Sound Booth Cue" />
    <meta property="og:description" content="Silent stage-to-sound-booth communication PWA for church musicians and audio engineers." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StageSync" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Suppress benign Vite dev HMR websocket notices in iframe preview
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason && (e.reason.message || String(e.reason));
        if (reason && (reason.includes('WebSocket') || reason.includes('closed without opened'))) {
          e.preventDefault();
        }
      });
    </script>
  </head>

  <body class="bg-black text-neutral-100 select-none overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
