<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark OLED Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Sound Stage Waves / Radio Pulse -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#06b6d4" stroke-width="6" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#22d3ee" stroke-width="8" stroke-opacity="0.7"/>

  <!-- Central Stage Beacon / Fader Sync Symbol -->
  <circle cx="256" cy="256" r="68" fill="#0891b2" filter="url(#neon)"/>
  <circle cx="256" cy="256" r="54" fill="#06b6d4"/>

  <!-- Glowing Sound / Stage Pulse Indicators -->
  <!-- Left Fader / Stage Mic -->
  <rect x="180" y="210" width="12" height="92" rx="6" fill="#f59e0b" filter="url(#neon)"/>
  <circle cx="186" cy="235" r="14" fill="#fbbf24"/>

  <!-- Right Fader / Booth Monitor -->
  <rect x="320" y="210" width="12" height="92" rx="6" fill="#f59e0b" filter="url(#neon)"/>
  <circle cx="326" cy="275" r="14" fill="#fbbf24"/>

  <!-- Center Stage Sync Lightning / Audio Wave Spark -->
  <path d="M256 220 L270 250 L250 254 L264 292 L242 262 L260 258 Z" fill="#ffffff" filter="url(#neon)"/>
</svg>
